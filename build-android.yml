name: Build Android APK

on:
  push:
    branches:
      - main # Menjalankan build setiap kali ada push ke branch main
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repositori kode
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup lingkungan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Setup Java Development Kit (JDK)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 4: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 5: Install dependensi npm/yarn
      - name: Install Dependencies
        run: npm ci

      # Step 6: Berikan izin eksekusi pada Gradle wrapper
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # Step 7: Proses kompilasi APK (Build Release)
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # Step 8: Upload hasil APK ke GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
